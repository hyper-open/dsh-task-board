# dsh-task-board bundle patch: inserts the plugin row into the profile roster.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field) over
# dsh-base. The row is a bare plugin by package name: the node half (exports ".")
# runs in the host process (task ledger, task_board_* tools, system-prompt
# section, /taskboard JSON+SSE routes), and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client") load in the web GUI.
- insert:
    - id: dsh-task-board
      name: dsh-project-tasks
